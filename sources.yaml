# Pozice musí v názvu splnit KAŽDOU skupinu (stačí jedno slovo ze skupiny).
# Položky jsou regulární výrazy; diakritika a velikost písmen se ignorují.
filters:
  - ['\bstaz', '\bintern(s|ship)?\b', 'junior', 'trainee', 'absolvent', 'graduate', 'student', 'praktik', 'brigad', 'part.?time']
  - ['financ', 'ucet', 'account', 'audit', 'controll', 'risk', 'treasury', 'bank', 'invest', 'tax', 'danov', 'fp&a', 'reporting', 'pojist', 'insur', 'kredit', 'credit']

# Pozice s těmito slovy v názvu se přeskočí.
exclude: ['senior', 'manager', 'director', 'head of', 'lead\b', 'vedouci']

# Lokalita se kontroluje jen tam, kde ji zdroj uvádí. Přidej třeba 'praha', 'prague'.
locations: ['brno', 'remote', 'home ?office', 'hybrid']

# Sem přidávej firmy (názvy musí být unikátní; návod je v README).
sources:
  # - {name: Firma A, type: greenhouse, board: xyz}
  # - {name: Firma B, type: lever, company: xyz}
  # - {name: Firma C, type: smartrecruiters, company: Xyz}
  # - {name: Firma D, type: workday, host: xyz.wd3.myworkdayjobs.com, tenant: xyz, site: Site, query: intern}
  # - {name: Firma E, type: page, url: "https://firma.cz/kariera"}
  # - {name: Google Alert, type: rss, url: "https://www.google.com/alerts/feeds/..."}
